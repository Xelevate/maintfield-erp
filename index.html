<script>
'use strict';
// Static, read-only analytical ERP prototype. No credentials or write APIs are embedded.
const SEED=JSON.parse(document.getElementById('seed-data').textContent);
const META=JSON.parse(document.getElementById('schema-data').textContent);
const DB=structuredClone(SEED);
const CURRENC=(n,d=0)=>Number(n||0).toLocaleString('en-EG',{minimumFractionDigits:d,maximumFractionDigits:d});
const EGP=n=>'EGP '+CURRENC(n);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKey=k=>k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace(/Egp/g,'EGP').replace(/ Id/g,' ID');
const yrmon=s=>String(s||'').slice(0,7);
const dObj=s=>new Date(String(s||'')+'T12:00:00');
const num=x=>Number(x)||0;
const snapDate='2026-10-15';
const categories=['All categories','Machinery','Implements','Spare Parts','Service','Maintenance Contract'];
const sections=['CRM','Sales','Service','Inventory','Procurement','Finance','Accounting','HR','Documents','Operations'];
const icons={CRM:'♧',Sales:'◈',Service:'⚒',Inventory:'▣',Procurement:'⇄',Finance:'◉',Accounting:'▥',HR:'♙',Documents:'▤',Operations:'▦'};
const pages=['dashboard','analytics','connections'];
const NAV=['dashboard','Sales','CRM','Service','Inventory','Procurement','Finance','Accounting','HR','Documents','Operations','analytics'];
const KEY_MAP=Object.fromEntries(Object.entries(META).map(([k,v])=>[v.primary_key,k]));
const state={page:'dashboard',activeTable:'invoices',dateFrom:'2026-01-01',dateTo:snapDate,gov:'All governorates',segment:'All segments',category:'All categories',month:'',invoiceStatus:'All statuses',trend:true,pieMode:'donut',sortCol:'',sortAsc:true,tableSearch:'',tableStatus:'All statuses',offset:0,demoMode:new URLSearchParams(location.search).get('demo')==='1',sourceStatus:{},configs:loadConfigs()};
function loadConfigs(){try{return JSON.parse(localStorage.getItem('mf_sheets_config_v1')||'{}')}catch{return {}}}
function saveConfigs(){localStorage.setItem('mf_sheets_config_v1',JSON.stringify(state.configs))}
function all(t){return DB[t]||[]}
function byId(t,k){return all(t).find(x=>String(x[META[t].primary_key])===String(k))}
function customerFor(c){return byId('customers',c)}
function customerMatch(id){const c=customerFor(id);if(!c)return state.gov==='All governorates' && state.segment==='All segments';return (state.gov==='All governorates'||state.gov===c.governorate)&&(state.segment==='All segments'||state.segment===c.segment)}
function within(s){return !!s&&String(s).slice(0,10)>=state.dateFrom&&String(s).slice(0,10)<=state.dateTo}
function invMatches(r){return within(r.invoice_date)&&customerMatch(r.customer_id)&&(state.category==='All categories'||r.revenue_category===state.category)&&(state.month===''||yrmon(r.invoice_date)===state.month)&&(state.invoiceStatus==='All statuses'||r.status===state.invoiceStatus)}
function invoices(){return all('invoices').filter(invMatches)}
function periodExpenses(){return all('expenses').filter(x=>within(x.expense_date)&&(state.month===''||yrmon(x.expense_date)===state.month))}
function periodPayments(){const idSet=new Set(all('invoices').filter(x=>customerMatch(x.customer_id)&&(state.category==='All categories'||x.revenue_category===state.category)&&(state.invoiceStatus==='All statuses'||x.status===state.invoiceStatus)).map(x=>x.invoice_id));return all('payments').filter(p=>within(p.payment_date)&&idSet.has(p.invoice_id)&&(state.month===''||yrmon(p.payment_date)===state.month))}
function cashFiltered(){return all('cash_transactions').filter(x=>within(x.transaction_date)&&(state.month===''||yrmon(x.transaction_date)===state.month))}
function workFiltered(){return all('work_orders').filter(x=>within(x.opened_date)&&customerMatch(x.customer_id)&&(state.month===''||yrmon(x.opened_date)===state.month))}
function contractsFiltered(){return all('maintenance_contracts').filter(x=>customerMatch(x.customer_id))}
function leadsFiltered(){return all('leads').filter(x=>within(x.created_date)&&customerMatch(x.customer_id)&&(state.month===''||yrmon(x.created_date)===state.month))}
function sum(arr,key){return arr.reduce((a,r)=>a+num(r[key]),0)}
function isOpen(x){return !['Paid','Closed','Completed','Resolved','Cancelled','Done','Rejected'].includes(x)}
function linkPage(page,tab){state.page=page;state.activeTable=tab||defaultTable(page);state.tableSearch='';state.tableStatus='All statuses';state.offset=0;state.sortCol='';document.getElementById('globalSearch').value='';render();window.scrollTo(0,0)}
function defaultTable(page){const found=Object.keys(META).find(k=>META[k].section===page);return found||'customers'}
function tabFor(page){return Object.keys(META).filter(k=>META[k].section===page)}
function navHtml(){const iconMap={dashboard:'⌂',analytics:'▥',connections:'⚙'};return NAV.map(n=>`<button class="navBtn ${state.page===n?'active':''}" data-page="${n}">${iconMap[n]||icons[n]||'○'} &nbsp;${n==='dashboard'?'Home':n==='analytics'?'Analytics':esc(n)}</button>`).join('')}
function sideHtml(){let s=`<div class="sideTitle">Your workspace</div><button class="sideBtn ${state.page==='dashboard'?'selected':''}" data-page="dashboard"><span class="ico">⌂</span>Overview dashboard</button><button class="sideBtn ${state.page==='analytics'?'selected':''}" data-page="analytics"><span class="ico">▥</span>Business analytics</button><div class="sideDivider"></div>`;
for(const section of sections){s+=`<div class="sideTitle">${icons[section]||''} &nbsp;${section}</div>`;for(const name of tabFor(section))s+=`<button data-table="${name}" class="sideBtn ${state.page===section&&state.activeTable===name?'selected':''}"><span class="ico">▫</span>${esc(fmtKey(name))}<em>${all(name).length}</em></button>`}
s+=`<div class="sideDivider"></div><button class="sideBtn ${state.page==='connections'?'selected':''}" data-page="connections"><span class="ico">⚙</span>Google Sheets setup</button><div class="sideFooter">Maintfield • Egypt<br/>Prototype v1.0<br/>All current records are fictional.</div>`;return s}
function header(title,desc,buttons=''){return `<div class="pageTitle"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${buttons}</div></div>`}
function btn(label,act,variant=''){return `<button class="btn ${variant}" data-action="${act}">${label}</button>`}
function render(){document.getElementById('topNav').innerHTML=navHtml();document.getElementById('sidebar').innerHTML=sideHtml();document.getElementById('sourceBadge').textContent=Object.values(state.sourceStatus).filter(v=>v==='Connected').length?`LIVE SHEETS · ${Object.values(state.sourceStatus).filter(v=>v==='Connected').length}`:(state.demoMode?'SYNTHETIC DEMO DATA · ?demo=1':'SYNTHETIC DEMO DATA');document.getElementById('main').innerHTML=state.page==='dashboard'||state.page==='analytics'?dashboardHtml():state.page==='connections'?connectionsPage():sectionPage();}
function kpi(label,value,foot,icon){return `<div class="card kpi"><div class="over"><span class="kpiLabel">${label}</span><span class="kpiIcon">${icon}</span></div><div class="value" title="${esc(value)}">${value}</div><div class="foot">${foot}</div></div>`}
function filtersHtml(){const govs=[...new Set(all('customers').map(x=>x.governorate))].sort();const segs=[...new Set(all('customers').map(x=>x.segment))].sort();let opts=(ls,sel)=>ls.map(x=>`<option ${sel===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('');return `<div class="card filterPanel"><div class="filterHdr"><span>◫ &nbsp; Cross-filter dashboard</span><span class="small" style="font-weight:500;color:#91a092">Filters change linked KPIs and charts</span></div><div class="filters"><label><span class="fieldLabel">From</span><input id="dateFrom" class="control" type="date" value="${state.dateFrom}"></label><label><span class="fieldLabel">To</span><input id="dateTo" class="control" type="date" value="${state.dateTo}"></label><label><span class="fieldLabel">Governorate</span><select id="govFilter" class="control">${opts(['All governorates',...govs],state.gov)}</select></label><label><span class="fieldLabel">Customer segment</span><select id="segmentFilter" class="control">${opts(['All segments',...segs],state.segment)}</select></label><label><span class="fieldLabel">Revenue type</span><select id="categoryFilter" class="control">${opts(categories,state.category)}</select></label></div><div class="chips">${state.month?`<button class="chip" data-clear="month">Month: ${esc(state.month)} ✕</button>`:''}${state.category!=='All categories'?`<button class="chip" data-clear="category">${esc(state.category)} ✕</button>`:''}${state.gov!=='All governorates'?`<button class="chip" data-clear="gov">${esc(state.gov)} ✕</button>`:''}${state.invoiceStatus!=='All statuses'?`<button class="chip" data-clear="invoiceStatus">${esc(state.invoiceStatus)} ✕</button>`:''}<button class="chip" data-action="reset-filters">↺ Reset filters</button><label class="small" style="display:flex;align-items:center;gap:5px;margin-left:auto;color:#87958a"><input type="checkbox" id="trendToggle" ${state.trend?'checked':''}> 3-month trendline</label></div></div>`}
function kpisHtml(){const ins=invoices(),pays=periodPayments(),ws=workFiltered(),ls=leadsFiltered();const invId=new Set(ins.map(x=>x.invoice_id));let receivedAll=all('payments').filter(p=>invId.has(p.invoice_id));const outstanding=Math.max(0,sum(ins,'amount_egp')-sum(receivedAll,'amount_egp'));const activeC=contractsFiltered().filter(x=>x.status==='Active').length;const alerts=all('inventory').filter(x=>num(x.on_hand)-num(x.reserved)<=num(x.reorder_point)).length;const won=ls.filter(x=>x.stage==='Won').length;const open=ws.filter(x=>isOpen(x.status)).length;const cashOut=sum(cashFiltered().filter(x=>x.direction==='Out'),'amount_egp');return `<div class="kpis">${kpi('Invoiced Revenue',EGP(sum(ins,'amount_egp')),'Invoice issue date · selected filters','↗')}${kpi('Cash Collected',EGP(sum(pays,'amount_egp')),'Receipt date · selected filters','↓')}${kpi('Invoice Balance',EGP(outstanding),'Open balance on filtered invoices','◴')}${kpi('Open Work Orders',CURRENC(open),'Opened in selected period · filtered clients','⚒')}${kpi('Active Contracts',CURRENC(activeC),'Current customer selection · all dates','▤')}${kpi('Low-stock Lines',CURRENC(alerts),'Company-wide warehouse alert','▣')}${kpi('Cash Outflow',EGP(cashOut),'Company-wide · cash transaction date','↑')}${kpi('Lead Win Rate',ls.length?(won/ls.length*100).toFixed(1)+'%':'0.0%','Won / created leads in selected period','◈')}</div>`}
function safeMax(vals){return Math.max(1,...vals.map(x=>Math.abs(Number(x)||0)))}
function abbr(n){n=num(n);if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(n>=100000?0:1)+'k';return CURRENC(n)}
function monthlyBins(){let out=[];let s=new Date(state.dateFrom+'T12:00:00'),e=new Date(state.dateTo+'T12:00:00');if(isNaN(s)||isNaN(e)||s>e)return out;let cur=new Date(s.getFullYear(),s.getMonth(),1);while(cur<=e&&out.length<36){out.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'));cur.setMonth(cur.getMonth()+1)}return out}
function movingAverage(v,i){return v.slice(Math.max(0,i-2),i+1).reduce((a,b)=>a+b,0)/Math.min(i+1,3)}
function svgLineChart(months,series){const W=650,H=215,P={l:48,r:13,t:10,b:33},cw=W-P.l-P.r,ch=H-P.t-P.b,n=months.length||1;let mx=safeMax(series.flatMap(s=>s.vals));mx*=1.14;let sy=v=>P.t+ch-(v/mx)*ch,sx=i=>P.l+cw*(n===1?.5:i/(n-1));let s='';for(let i=0;i<=4;i++){let y=P.t+ch*i/4;s+=`<line class="axis" x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/><text class="tick" x="${P.l-8}" y="${y+4}" text-anchor="end">${abbr(mx*(4-i)/4)}</text>`}months.forEach((m,i)=>{if(i%Math.max(1,Math.ceil(n/8))===0||i===n-1)s+=`<text class="tick" x="${sx(i)}" y="${H-7}" text-anchor="middle">${esc(m.slice(2))}</text>`});for(const item of series){const coords=item.vals.map((v,i)=>[sx(i),sy(v)]);if(!coords.length)continue;s+=`<polyline points="${coords.map(x=>x.join(',')).join(' ')}" fill="none" stroke="${item.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;if(state.trend && item.name==='Revenue'&&coords.length>1){const t=item.vals.map((v,i)=>[sx(i),sy(movingAverage(item.vals,i))]);s+=`<polyline class="trend" points="${t.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#b49a42" stroke-width="2" stroke-dasharray="5 5"/>`}
item.vals.forEach((v,i)=>{s+=`<circle class="point" cx="${sx(i)}" cy="${sy(v)}" r="4.7" fill="${item.color}" stroke="white" stroke-width="2" data-month="${esc(months[i])}"><title>${esc(item.name)} · ${esc(months[i])}: ${EGP(v)} — click to cross-filter</title></circle>`})}return `<svg viewBox="0 0 ${W} ${H}" class="chartSVG" role="img" aria-label="Monthly revenue and operating expenses trend chart">${s}</svg>`}
function barChart(items){const W=490,H=205,p={l:57,r:8,t:12,b:45},max=safeMax(items.map(x=>x.value))*1.16;let svg='';for(let i=0;i<=4;i++){let y=p.t+(H-p.t-p.b)*i/4;svg+=`<line class="axis" x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}"/><text class="tick" x="${p.l-8}" y="${y+4}" text-anchor="end">${abbr(max*(4-i)/4)}</text>`}
items.forEach((x,i)=>{let a=(W-p.l-p.r)/items.length, bw=a*.57,xpos=p.l+i*a+(a-bw)/2,height=x.value/max*(H-p.t-p.b),y=H-p.b-height;svg+=`<rect class="bar" x="${xpos}" y="${y}" width="${bw}" height="${Math.max(.5,height)}" rx="3" fill="${x.color||'#318465'}" data-category="${esc(x.name)}"><title>${esc(x.name)} · ${EGP(x.value)} — click to cross-filter</title></rect><text class="tick" x="${xpos+bw/2}" y="${H-30}" text-anchor="middle">${esc(x.name.length>14?x.name.slice(0,12)+'…':x.name)}</text><text class="tick" x="${xpos+bw/2}" y="${H-17}" text-anchor="middle">${abbr(x.value)}</text>`});return `<svg viewBox="0 0 ${W} ${H}" class="chartSVG" role="img" aria-label="Revenue split by category bar chart">${svg}</svg>`}
function donut(items){let total=items.reduce((a,x)=>a+x.value,0),cx=145,cy=100,r=68,inner=state.pieMode==='pie'?0:46,ang=-90,paths='';const pt=(a,rr)=>({x:cx+Math.cos(a*Math.PI/180)*rr,y:cy+Math.sin(a*Math.PI/180)*rr});for(const x of items.filter(x=>x.value>0)){let sweep=360*x.value/Math.max(1,total),a=ang,b=ang+Math.min(359.999,sweep),s=pt(a,r),e=pt(b,r),inn1=pt(b,inner),inn2=pt(a,inner),large=sweep>180?1:0;paths+=`<path class="slice" d="M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} L ${inn1.x} ${inn1.y} A ${inner||.01} ${inner||.01} 0 ${large} 0 ${inn2.x} ${inn2.y} Z" fill="${x.color}" data-status="${esc(x.name)}"><title>${esc(x.name)} · ${x.value} records (${(x.value/total*100).toFixed(1)}%)</title></path>`;ang+=sweep}
let legend=items.map(x=>`<div class="statLine"><span><i class="dot" style="background:${x.color}"></i>${esc(x.name)}</span><b>${x.value}</b></div>`).join('');return `<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><svg viewBox="0 0 290 200" role="img" aria-label="Invoice status donut" style="flex:1;min-width:175px;height:205px">${paths}${state.pieMode==='donut'?`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#294535" font-size="26" font-weight="800">${total}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#8b9a8e" font-size="12">Invoices</text>`:''}</svg><div style="flex:1;min-width:137px">${legend}</div></div>`}
function dashboardHtml(){const ins=invoices(),exp=periodExpenses();const months=monthlyBins();const revenueM=months.map(m=>sum(ins.filter(x=>yrmon(x.invoice_date)===m),'amount_egp'));const expM=months.map(m=>sum(exp.filter(x=>yrmon(x.expense_date)===m),'amount_egp'));
const revSeries=[{name:'Revenue',color:'#33876c',vals:revenueM},{name:'Operating expenses',color:'#cf9664',vals:expM}];const revCat=['Machinery','Implements','Spare Parts','Service','Maintenance Contract'];const cols=['#a58c34','#6f8696','#32916e','#c68f62','#815b73'];const items=revCat.map((name,i)=>({name,value:sum(ins.filter(x=>x.revenue_category===name),'amount_egp'),color:cols[i]}));const statuses=['Paid','Part Paid','Unpaid','Overdue'];const statusItems=statuses.map((name,i)=>({name,value:ins.filter(x=>x.status===name).length,color:['#308765','#c9a144','#8a9f9a','#c56c61'][i]}));
const open=all('work_orders').filter(x=>isOpen(x.status));const overdue=all('invoices').filter(x=>x.status==='Overdue').length;const alerts=all('inventory').filter(x=>num(x.on_hand)-num(x.reserved)<=num(x.reorder_point)).length;const reminders=all('tasks').filter(x=>x.status!=='Done').slice(0,4);
const tiles=`<div class="tiles"><button class="tile gold" data-table="sales_orders"><span class="tileIcon">◈</span><span><strong>Sales & Orders</strong><small>Quotes · orders · pipeline</small></span></button><button class="tile rust" data-table="work_orders"><span class="tileIcon">⚒</span><span><strong>Field Services</strong><small>Work orders · visits</small></span></button><button class="tile slate" data-table="invoices"><span class="tileIcon">▤</span><span><strong>Finance Center</strong><small>Invoices · collections</small></span></button><button class="tile green" data-table="inventory"><span class="tileIcon">▣</span><span><strong>Stock & Parts</strong><small>Products · warehouse</small></span></button></div>`;
const tableRows=ins.slice().sort((a,b)=>b.invoice_date.localeCompare(a.invoice_date)).slice(0,7).map(x=>`<tr><td><button class="rowLink" data-record="invoices|${esc(x.invoice_id)}">${esc(x.invoice_id)}</button></td><td>${esc(customerFor(x.customer_id)?.customer_name||x.customer_id)}</td><td>${esc(x.invoice_date)}</td><td>${EGP(x.amount_egp)}</td><td>${pill(x.status)}</td></tr>`).join('');

// Full CSV tokenizer: handles quoted delimiters, escaped quotes, CRLF, and multiline values.
function parseCSV(str){str=String(str||'').replace(/^\uFEFF/,'');let rows=[],row=[],v='',inside=false;for(let i=0;i<str.length;i++){const ch=str[i];if(ch==='"'){if(inside&&str[i+1]==='"'){v+='"';i++}else inside=!inside}else if(ch===','&&!inside){row.push(v);v=''}else if((ch==='\n'||ch==='\r')&&!inside){if(ch==='\r'&&str[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=ch}if(inside)throw Error('Incomplete quoted CSV value');row.push(v);if(row.some(x=>x!==''))rows.push(row);return rows}
function normalizeCSV(name,raw){const rows=parseCSV(raw);if(rows.length<2)throw Error('No data rows in CSV');const expected=META[name].columns;const header=rows[0].map(x=>x.trim());const missing=expected.filter(x=>!header.includes(x));if(missing.length)throw Error('Missing headers: '+missing.slice(0,5).join(', '));const out=[];for(const cols of rows.slice(1)){let o={};for(const col of expected){const index=header.indexOf(col);let v=cols[index]??'';if((/_egp$|_pct$/.test(col)||['quantity','on_hand','reserved','reorder_point','horsepower','operating_hours','visits_included','visits_completed','hours_worked','depreciation_years','quantity_delta','deductions','allowances'].includes(col))&&v!==''&&!Number.isNaN(Number(String(v).replace(/,/g,''))))v=Number(String(v).replace(/,/g,''));o[col]=v}if(Object.values(o).some(x=>String(x).trim()!==''))out.push(o)}if(!out.length)throw Error('CSV contained no valid records');let ids=out.map(x=>String(x[META[name].primary_key]??''));if(ids.some(x=>!x))throw Error('Blank primary key found');if(new Set(ids).size!==ids.length)throw Error('Duplicate primary key values found');return out}
async function syncSheets(){const jobs=Object.entries(state.configs).filter(([k,c])=>META[k]&&ensureHttp(c.csvUrl));if(!jobs.length){toast('No CSV links configured yet. Go to Google Sheets setup.');return}toast('Syncing '+jobs.length+' public CSV feeds…');let cursor=0,success=0,failed=[];async function worker(){while(cursor<jobs.length){const [name,c]=jobs[cursor++];const ctrl=new AbortController();const stop=setTimeout(()=>ctrl.abort(),16000);try{let resp=await fetch(c.csvUrl,{method:'GET',mode:'cors',credentials:'omit',signal:ctrl.signal,redirect:'follow'});if(!resp.ok)throw Error('HTTP '+resp.status);let rows=normalizeCSV(name,await resp.text());DB[name]=rows;state.sourceStatus[name]='Connected';success++}catch(e){state.sourceStatus[name]='Failed: '+(e.message||'network error');failed.push(name+': '+e.message)}finally{clearTimeout(stop)}}}await Promise.all(Array.from({length:Math.min(4,jobs.length)},worker));render();toast(`Connected ${success}/${jobs.length} Sheets`+(failed.length?` · Failed: ${failed.slice(0,2).join('; ')}`:''));return {success,failed}}

function getCurrentPage(){try{let x=location.hash.slice(1);return x==='analytics'||x==='connections'||x==='dashboard'?x:'dashboard'}catch{return'dashboard'}}
function routeTable(t){const p=META[t]?.section||'dashboard';if(!META[t])return;document.getElementById('drawerRoot').innerHTML='';linkPage(p,t)}
function action(name){if(name==='connections'){linkPage('connections');return}if(name==='pie-toggle'){state.pieMode=state.pieMode==='pie'?'donut':'pie';render();return}if(name==='open-settings'){openSettings();return}if(name==='close-modal'){closeModal();return}if(name==='close-record'){document.getElementById('drawerRoot').innerHTML='';return}if(name==='reset-filters'){Object.assign(state,{dateFrom:'2026-01-01',dateTo:snapDate,gov:'All governorates',segment:'All segments',category:'All categories',month:'',invoiceStatus:'All statuses'});render();return}if(name==='download-csv'){downloadCurrent();return}if(name==='download-dashboard'){dashboardExport();return}if(name==='prev-page'){state.offset=Math.max(0,state.offset-12);renderTable();return}if(name==='next-page'){state.offset+=12;renderTable();return}if(name==='save-settings'||name==='save-and-sync'){try{saveSettings();closeModal();render();if(name==='save-and-sync')syncSheets()}catch(e){toast(e.message)}return}if(name==='sync'){syncSheets();return}if(name==='export-config'){downloadBlob('maintfield_sheet_connections.json',new Blob([JSON.stringify(state.configs,null,2)],{type:'application/json'}));return}if(name==='import-config'){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files?.[0];if(!f)return;f.text().then(t=>{let c=JSON.parse(t);for(const [name,v] of Object.entries(c)){if(!META[name])throw new Error('Unknown dataset: '+name);for(const u of [v.csvUrl,v.formUrl])if(u&&!ensureHttp(u))throw new Error('Must use HTTPS URLs')}state.configs=c;saveConfigs();render();toast('Imported connection settings')}).catch(e=>toast('Import failed: '+e.message))};input.click();return}}
function renderTable(){if(state.page==='dashboard'||state.page==='analytics')render();else{document.getElementById('tableContent').innerHTML=tableHtml(state.activeTable)}}
function jumpId(key,id){let table=KEY_MAP[key];if(!table && key==='related_id'){for(const name of ['sales_orders','work_orders','maintenance_contracts','invoices','payments','expenses','purchase_orders'])if(byId(name,id)){table=name;break}}if(table&&byId(table,id)){openRecord(table,id)}else{let target=Object.keys(META).find(t=>byId(t,id));if(target)openRecord(target,id);else toast('No matching linked record for '+id)}}
// Interaction delegation keeps SVG charts, tables and quick links connected to shared filters.
document.addEventListener('click',e=>{let b=e.target.closest('[data-action],[data-page],[data-table],[data-record],[data-jump-id],[data-category],[data-month],[data-clear],[data-sort],[data-status]');if(!b)return;
if(b.dataset.action){e.preventDefault();action(b.dataset.action);return}
if(b.dataset.table){e.preventDefault();routeTable(b.dataset.table);return}
if(b.dataset.page){e.preventDefault();document.getElementById('drawerRoot').innerHTML='';linkPage(b.dataset.page);return}
if(b.dataset.record){e.preventDefault();let [table,id]=b.dataset.record.split('|');const sr=document.getElementById('searchResults');if(sr)sr.classList.add('hide');openRecord(table,id);return}
if(b.dataset.jumpId){e.preventDefault();let [key,id]=b.dataset.jumpId.split('|');jumpId(key,id);return}
if(b.dataset.category){state.category=state.category===b.dataset.category?'All categories':b.dataset.category;state.month='';render();return}
if(b.dataset.month){state.month=state.month===b.dataset.month?'':b.dataset.month;render();return}
if(b.dataset.clear){if(b.dataset.clear==='month')state.month='';if(b.dataset.clear==='category')state.category='All categories';if(b.dataset.clear==='gov')state.gov='All governorates';if(b.dataset.clear==='invoiceStatus')state.invoiceStatus='All statuses';render();return}
if(b.dataset.sort){const col=b.dataset.sort;state.sortAsc=state.sortCol===col?!state.sortAsc:true;state.sortCol=col;state.offset=0;renderTable();return}
if(b.dataset.status){state.invoiceStatus=state.invoiceStatus===b.dataset.status?'All statuses':b.dataset.status;render();return}});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='dateFrom'){state.dateFrom=el.value||'2026-01-01';state.month='';render()}if(el.id==='dateTo'){state.dateTo=el.value||snapDate;state.month='';render()}if(el.id==='govFilter'){state.gov=el.value;render()}if(el.id==='segmentFilter'){state.segment=el.value;render()}if(el.id==='categoryFilter'){state.category=el.value;render()}if(el.id==='trendToggle'){state.trend=el.checked;render()}if(el.id==='statusFilter'){state.tableStatus=el.value;state.offset=0;renderTable()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='tableSearch'){state.tableSearch=el.value;state.offset=0;const sel=el.selectionStart;renderTable();const replacement=document.getElementById('tableSearch');replacement.focus();replacement.setSelectionRange(sel,sel)}if(el.id==='globalSearch'){const q=el.value.trim().toLowerCase(),box=document.getElementById('searchResults');if(q.length<2){box.classList.add('hide');box.innerHTML='';return}let found=[];for(const [t,rows] of Object.entries(DB)){for(const row of rows){if(rowMatchesSearch(row,q)){found.push({table:t,id:row[META[t].primary_key]});if(found.length>=18)break}}if(found.length>=18)break}box.innerHTML=found.length?found.map(r=>`<button data-record=\"${esc(r.table)}|${esc(r.id)}\"><b>${esc(r.id)}</b><small>${esc(fmtKey(r.table))}</small></button>`).join(''):'<div class=\"empty\" style=\"padding:14px\">No matching demo records</div>';box.classList.remove('hide')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('drawerRoot').innerHTML=''}if(e.key==='/'&&document.activeElement?.tagName!=='INPUT'){e.preventDefault();document.getElementById('globalSearch').focus()}});
window.addEventListener('hashchange',()=>{const p=getCurrentPage();if(p!==state.page&&pages.includes(p)){state.page=p;render()}});
state.page=getCurrentPage();render();
// Auto-sync only configured public feeds. A reload resets unconfigured tables to safe embedded sample data.
if(Object.values(state.configs).some(v=>v?.csvUrl))syncSheets();
</script>
</body>
</html>
